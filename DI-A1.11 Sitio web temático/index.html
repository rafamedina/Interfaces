<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PokéSpot — Inicio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <svg class="pokeball-logo" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="45" fill="#fff" stroke="#333" stroke-width="5"></circle>
        <path d="M5 50 a45 45 0 0 0 90 0" fill="#ee4a4a"></path>
        <circle cx="50" cy="50" r="12" fill="#fff" stroke="#333" stroke-width="5"></circle>
      </svg>
      <h1>PokéSpot</h1>
    </div>

    <nav class="tabs" role="navigation" aria-label="Pestañas principales">
      <a href="index.html" class="tab-link" data-tab="inicio" aria-current="page">
        <!-- Home icon (fills when active via CSS) -->
        <svg class="icon icon-home" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11.5L12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V11.5z" />
        </svg>
        <span>Inicio</span>
      </a>
      <a href="detalles.html" class="tab-link" data-tab="detalles">
        <svg class="icon icon-details" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 11h3v2h-4V7h2v6z"/>
        </svg>
        <span>Detalles</span>
      </a>
      <a href="extras.html" class="tab-link" data-tab="extras">
        <svg class="icon icon-extras" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18v2H3V6zm0 5h12v2H3v-2zm0 5h8v2H3v-2z"/>
        </svg>
        <span>Extras</span>
      </a>
    </nav>
  </header>

  <main class="container">
    <section class="controls">
      <div class="search">
        <label for="search-input" class="visually-hidden">Buscar Pokémon</label>
        <input id="search-input" type="search" placeholder="Buscar por nombre..." />
      </div>
      <div class="filter">
        <label for="type-filter">Tipo:</label>
        <select id="type-filter">
          <option value="all">Todos</option>
          <option value="grass">Planta</option>
          <option value="fire">Fuego</option>
          <option value="water">Agua</option>
          <option value="electric">Eléctrico</option>
          <option value="normal">Normal</option>
        </select>
      </div>
    </section>

    <section class="cards-grid" id="pokemon-list" aria-live="polite">
      <!-- Cards generated by JS. Fallback content for no-js users: -->
      <article class="card no-js">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png" alt="Bulbasaur" />
        <h3>Bulbasaur</h3>
        <p class="category">Semilla Pokémon</p>
        <p class="meta">Tipo: Grass, Generation: I</p>
        <a class="btn" href="detalles.html?id=1">Ver detalles</a>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <p>Proyecto: PokéSpot — Responsive | Hecho sin frameworks</p>
  </footer>

  <script src="js/scripts.js"></script>
</body>
</html>
