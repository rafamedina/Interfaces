<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>



<body>
    <div class="contenedor">
        <h2>Formulario de trabajo</h2>
        <div class="input-group mb-3">
            <span class="input-group-text">Usuario</span>
            <input type="text" class="form-control" placeholder="Username" aria-label="Username" id="user"
                aria-describedby="basic-addon1">
        </div>

        <div class="input-group mb-3">
            <input type="text" class="form-control" placeholder="Recipient’s username"
                aria-label="Recipient’s username " id="email" aria-describedby="basic-addon2">
            <span class="input-group-text">@campusfp.es</span>
        </div>

        <span></span>
        <div class="input-group mb-3">
            <span class="input-group-text">Euros</span>
            <input type="text" class="form-control" id="salary" aria-label="Amount (to the nearest dollar)"
                placeholder="Cuanto quieres cobrar">
            <span class="input-group-text">.00</span>
        </div>


        <div class="input-group">
            <span class="input-group-text">Que deberiamos saber de ti</span>
            <textarea class="form-control" id="cuentanos" aria-label="With textarea"></textarea>
        </div>

        <br>
        <div class="boton">
            <button id="enviar" type="button" class="btn btn-info">Enviar</button>
        </div>




    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="index.js"></script>

</body>

</html>
