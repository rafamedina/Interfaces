<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body>



    <form class="formulario">
        <div class="mb-3 Nombre">
            <label for="Nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="Nombre" placeholder="Nombre">
        </div>
        <div class="mb-3 Apellidos">
            <label for="Apellidos" class="form-label">Apellidos</label>
            <input type="text" class="form-control" id="Apellidos" placeholder="Apellidos">
        </div>
        <div class="mb-3 Email">
            <label for="Email" class="form-label">Email</label>
            <input type="email" class="form-control" id="Email" placeholder="Email">
        </div>


        <div class="inputs opcion">
            <label for="radioDni">DNI</label>
            <input type="radio" value="dni" name="documento" id="radioDni" checked="checked">
            <label for="radioNie">NIE</label>
            <input type="radio" value="nie" name="documento" id="radioNie">

        </div>
        <div class="mb-3 dninie">
            <label id="EtiquetaDNINIE" for="dninie" class="form-label">DNI</label>
            <input type="text" class="form-control" id="dninie">
        </div>








        <div class="mb-3">
            <label for="Password" class="form-label">Password</label>
            <input type="password" class="form-control" id="Password" placeholder="Password">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="check" value=1>
            <label class="form-check-label" for="check">Check</label>
        </div>
        <button id="btn" type="submit" class="btn btn-primary">Submit</button>
    </form>












    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
